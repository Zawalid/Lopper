<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face { font-family: "Barlow"; font-weight: 800; src: url("../public/fonts/Barlow-800.woff2") format("woff2"); }
@font-face { font-family: "Barlow"; font-weight: 500; src: url("../public/fonts/Barlow-500.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("../public/fonts/IBMPlexMono-500.woff2") format("woff2"); }
* { box-sizing: border-box; margin: 0; }
body { width: 1200px; height: 630px; background: #0b100f; color: #f1f4f2; font-family: "Barlow", sans-serif; position: relative; overflow: hidden; }
.glow { position: absolute; inset: 0; background: radial-gradient(55% 60% at 78% 20%, rgba(140,242,204,0.09), transparent 70%); }
.left { position: absolute; left: 72px; top: 64px; bottom: 64px; width: 1056px; display: flex; flex-direction: column; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 16px; font-weight: 800; font-size: 34px; letter-spacing: -0.01em; }
.brand img { width: 64px; height: 64px; border-radius: 15px; }
h1 { font-weight: 800; font-size: 96px; line-height: 1.0; letter-spacing: -0.03em; text-transform: lowercase; }
.sub { margin-top: 22px; font-size: 30px; line-height: 1.35; color: #a3aeaa; font-weight: 500; max-width: 760px; }
.term { margin-top: 34px; padding: 22px 26px; border-radius: 14px; background: #0f1614; border: 1px solid rgba(241,244,242,0.2); font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 22px; line-height: 1.6; color: #d7dedb; max-width: 960px; }
.term .p { color: #8cf2cc; } .term .e { color: #f0a29a; }
.url { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 22px; color: #8cf2cc; }
</style></head><body>
<div class="glow"></div>
<div class="left">
  <div class="brand"><img src="../src/assets/icon.png" alt="">Lopper</div>
  <div>
    <h1>git cleanup guides.</h1>
    <p class="sub">Branches, worktrees and the AI agents that leave them behind. Every command run before it was written down.</p>
    <div class="term"><span class="p">$</span> git branch -d claude/checkout-redesign<br><span class="e">error: cannot delete branch ... used by worktree</span></div>
  </div>
  <div class="url">lopper.zawalid.com/guides</div>
</div>
</body></html>
