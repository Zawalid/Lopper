<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face { font-family: "Barlow"; font-weight: 800; src: url("../public/fonts/Barlow-800.woff2") format("woff2"); }
@font-face { font-family: "Barlow"; font-weight: 500; src: url("../public/fonts/Barlow-500.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("../public/fonts/IBMPlexMono-500.woff2") format("woff2"); }
* { box-sizing: border-box; margin: 0; }
body { width: 1200px; height: 630px; background: #0b100f; color: #f1f4f2; font-family: "Barlow", sans-serif; position: relative; overflow: hidden; }
.glow { position: absolute; inset: 0; background: radial-gradient(55% 60% at 78% 20%, rgba(140,242,204,0.09), transparent 70%); }
.left { position: absolute; left: 72px; top: 64px; bottom: 64px; width: 520px; display: flex; flex-direction: column; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 16px; font-weight: 800; font-size: 34px; letter-spacing: -0.01em; }
.brand img { width: 64px; height: 64px; border-radius: 15px; }
h1 { font-weight: 800; font-size: 76px; line-height: 1.0; letter-spacing: -0.025em; text-transform: lowercase; }
.sub { margin-top: 22px; font-size: 27px; line-height: 1.35; color: #a3aeaa; font-weight: 500; max-width: 460px; }
.url { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 22px; color: #8cf2cc; }
.shot { position: absolute; left: 640px; top: 96px; width: 760px; border: 1px solid rgba(255,255,255,0.14); border-radius: 16px; overflow: hidden; }
.shot img { display: block; width: 100%; }
</style></head><body>
<div class="glow"></div>
<div class="left">
  <div class="brand"><img src="../src/assets/icon.png" alt="">Lopper</div>
  <div><h1>keep your repositories light.</h1><p class="sub">A Mac app that removes the branches and folders you no longer need, and shows why each is safe.</p></div>
  <div class="url">lopper.zawalid.com</div>
</div>
<div class="shot"><img src="../src/assets/shots/overview-dark.png" alt=""></div>
</body></html>
