name: Lopper
options:
  bundleIdPrefix: com.zawalid
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Lopper:
    path: ..
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.6
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
targets:
  LopperApp:
    type: application
    platform: macOS
    sources:
      - LopperApp
    dependencies:
      - package: Lopper
        product: Lopper
      - package: Sparkle
        product: Sparkle
    entitlements:
      path: LopperApp/Lopper.entitlements
      properties:
        # Sparkle is signed by its own identity. A hardened app signed ad hoc (no team) refuses to load a framework
        # signed by a different one and crashes at launch, so library validation has to be off. See docs/updates.md.
        com.apple.security.cs.disable-library-validation: true
    info:
      path: LopperApp/Info.plist
      properties:
        SUFeedURL: https://github.com/Zawalid/Lopper/releases/latest/download/appcast.xml
        SUPublicEDKey: sRYsiToQSh4zkfdb+PY9b1Km5yByYA7deW3ZIG7RFXk=
        # Never check on its own until the person turns it on in Settings, and never show Sparkle's own prompt.
        SUEnableAutomaticChecks: false
        SUAllowsAutomaticUpdates: false
    settings:
      base:
        PRODUCT_NAME: Lopper
        PRODUCT_MODULE_NAME: LopperApp
        PRODUCT_BUNDLE_IDENTIFIER: com.zawalid.lopper
        MARKETING_VERSION: 0.5.2
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lopper
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  LopperAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - LopperAppTests
    dependencies:
      - target: LopperApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zawalid.lopper.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Lopper.app/Contents/MacOS/Lopper"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Lopper:
    build:
      targets:
        LopperApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LopperAppTests
