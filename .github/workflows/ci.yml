name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure git for the tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - run: swift test

  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure git for the tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - run: brew install xcodegen
      - run: cd App && xcodegen generate
      - name: Test the app
        run: |
          xcodebuild test \
            -project App/Lopper.xcodeproj -scheme Lopper \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

  # Informational until the engine builds on Linux; once it passes, remove continue-on-error to keep it portable.
  linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build the engine and the command line tool
        run: swift build --product lop
